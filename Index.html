<!DOCTYPE html>
<html>
<head>
    <title>Sleep Quality Predictor</title>
</head>
<body>
    <h1>Sleep Quality Predictor</h1>
    <p>Welcome to my AI project.</p>

    <label>Sleep Duration (hours):</label>
    <input type="number" id="sleep"><br><br>

    <label>Stress Level (1-10):</label>
    <input type="number" id="stress"><br><br>

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>

    <script>
    function predict() {
        let sleep = parseFloat(document.getElementById("sleep").value);
        let stress = parseInt(document.getElementById("stress").value);

        if (sleep >= 7 && stress <= 5) {
            document.getElementById("result").innerHTML =
                "✅ Good Sleep Expected";
        } else {
            document.getElementById("result").innerHTML =
                "⚠️ Poor Sleep Expected";
        }
    }
    </script>
</body>
</html>
