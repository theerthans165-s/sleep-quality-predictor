<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepAI - Sleep Quality Predictor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:400px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

h1{
color:#333;
margin-bottom:10px;
}

.subtitle{
color:gray;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.result{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f5f5f5;
}

.score{
font-size:28px;
font-weight:bold;
color:#667eea;
}

.quality{
font-size:20px;
margin-top:10px;
font-weight:bold;
}

.tip{
margin-top:10px;
color:#555;
}

</style>
</head>

<body>

<div class="container">

<h1>😴 SleepAI</h1>
<p class="subtitle">AI Powered Sleep Quality Predictor</p>

<input type="number" id="age" placeholder="Enter Age">

<input type="number" id="sleep" placeholder="Sleep Duration (Hours)">

<input type="number" id="stress" placeholder="Stress Level (1-10)">

<input type="number" id="steps" placeholder="Daily Steps">

<button onclick="predict()">Predict Sleep Quality</button>

<div class="result" id="result" style="display:none;">
<div class="score" id="score"></div>
<div class="quality" id="quality"></div>
<div class="tip" id="tip"></div>
</div>

</div>

<script>

function predict(){

let sleep =
parseFloat(document.getElementById("sleep").value);

let stress =
parseInt(document.getElementById("stress").value);

let steps =
parseInt(document.getElementById("steps").value);

let score = 50;

if(sleep >= 7) score += 25;
if(stress <= 5) score += 15;
if(steps >= 8000) score += 10;

let quality = "";
let tip = "";

if(score >= 80){
quality = "✅ Good Sleep";
tip = "Great job! Maintain your current routine.";
}
else if(score >= 60){
quality = "😐 Average Sleep";
tip = "Try reducing stress and increasing activity.";
}
else{
quality = "⚠️ Poor Sleep";
tip = "Improve sleep duration and manage stress.";
}

document.getElementById("result").style.display="block";
document.getElementById("score").innerHTML =
score + "/100";

document.getElementById("quality").innerHTML =
quality;

document.getElementById("tip").innerHTML =
tip;

}

</script>

</body>
</html>
