<!DOCTYPE html><html>
<head>
<title>Sleep Quality Predictor</title><style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:white;
    width:90%;
    max-width:350px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#333;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style></head><body><div class="container">
<h1>😴 Sleep Predictor</h1><input type="number" id="sleep" placeholder="Sleep Duration (hours)"><input type="number" id="stress" placeholder="Stress Level (1-10)"><button onclick="predict()">Predict</button>

<h2 id="result"></h2>
</div><script>
function predict() {

let sleep =
parseFloat(document.getElementById("sleep").value);

let stress =
parseInt(document.getElementById("stress").value);

if (sleep >= 7 && stress <= 5) {
document.getElementById("result").innerHTML =
"✅ Good Sleep";
}
else {
document.getElementById("result").innerHTML =
"⚠️ Poor Sleep";
}
}
</script></body>
</html>
