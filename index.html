<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepAI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#111;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,230,118,0.2);
}

.slide{
display:none;
text-align:center;
}

#slide1{
display:block;
}

h1{
color:#00e676;
margin-bottom:10px;
text-shadow:
0 0 10px #00e676,
0 0 20px #00e676;
}

h2{
margin-bottom:15px;
}

p{
color:#ccc;
margin-bottom:15px;
}

img{
width:100%;
max-width:320px;
border-radius:15px;
margin:15px 0;
}

.info-box{
background:#1b1b1b;
padding:15px;
border-radius:12px;
border:1px solid #00e676;
box-shadow:0 0 10px rgba(0,230,118,0.3);
margin-top:15px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
background:#222;
border:1px solid #333;
border-radius:10px;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#00c853;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;

box-shadow:
0 0 10px #00c853,
0 0 20px #00c853;
}

.score{
font-size:42px;
font-weight:bold;
color:#00e676;
margin:15px 0;
text-shadow:
0 0 10px #00e676;
}

.result-box{
background:#1b1b1b;
padding:15px;
border-radius:12px;
border:1px solid #00e676;
box-shadow:0 0 10px rgba(0,230,118,0.3);
}

</style>
</head>

<body>

<div class="container">

<!-- Slide 1 -->

<div id="slide1" class="slide">

<h1>😴 SleepAI</h1>

<p>AI Powered Sleep Quality Predictor</p>

<img src="benefits.png" alt="Benefits of Sleep">

<div class="info-box">

<h3>🌙 Why Sleep Matters</h3>

<p>
Getting 7–9 hours of quality sleep improves physical health,
mental wellbeing, emotional balance, immunity,
and overall energy.
</p>

</div>

<button onclick="showSlide(2)">
Get Started
</button>

</div>

<!-- Slide 2 -->

<div id="slide2" class="slide">

<h2>Enter Your Details</h2>

<input type="number"
id="sleep"
placeholder="Sleep Hours">

<input type="number"
id="stress"
placeholder="Stress Level (1-10)">

<input type="number"
id="steps"
placeholder="Daily Steps">

<button onclick="predict()">
Predict Sleep Quality
</button>

</div>

<!-- Slide 3 -->

<div id="slide3" class="slide">

<h2>Prediction Result</h2>

<div class="result-box">

<div id="score" class="score"></div>

<h3 id="quality"></h3>

<p id="tip"></p>

</div>

<button onclick="showSlide(1)">
Try Again
</button>

</div>

</div>

<script>

function showSlide(num){

document.getElementById("slide1").style.display="none";
document.getElementById("slide2").style.display="none";
document.getElementById("slide3").style.display="none";

document.getElementById("slide"+num).style.display="block";

}

function predict(){

let sleep =
parseFloat(document.getElementById("sleep").value);

let stress =
parseInt(document.getElementById("stress").value);

let steps =
parseInt(document.getElementById("steps").value);

if(isNaN(sleep) || isNaN(stress) || isNaN(steps)){

alert("Please enter all details");
return;

}

let score = 50;

if(sleep >= 7) score += 25;
if(stress <= 5) score += 15;
if(steps >= 8000) score += 10;

let quality="";
let tip="";

if(score >= 80){

quality="✅ Good Sleep";

tip="Excellent! Maintain your healthy sleep routine.";

}
else if(score >= 60){

quality="😐 Average Sleep";

tip="Try reducing stress and increasing physical activity.";

}
else{

quality="⚠️ Poor Sleep";

tip="Increase sleep duration and manage stress effectively.";

}

document.getElementById("score").innerHTML =
score + "/100";

document.getElementById("quality").innerHTML =
quality;

document.getElementById("tip").innerHTML =
tip;

showSlide(3);

}

</script>

</body>
</html>
