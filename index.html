
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepAI</title>

<style>

body{
background:#000;
font-family:Arial,sans-serif;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:90%;
max-width:400px;
background:#111;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,0.1);
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
}

button{
width:100%;
padding:12px;
background:#00c853;
color:white;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
}

.slide{
display:none;
}

#slide1{
display:block;
}

.score{
font-size:32px;
font-weight:bold;
color:#00e676;
}

</style>
</head>

<body>

<div class="container">

<div id="slide1" class="slide">
<h1>😴 SleepAI</h1>
<p>AI Powered Sleep Quality Predictor</p>
<button onclick="showSlide(2)">Start</button>
</div>

<div id="slide2" class="slide">

<h2>Enter Details</h2>

<input type="number" id="sleep" placeholder="Sleep Hours">

<input type="number" id="stress" placeholder="Stress Level (1-10)">

<input type="number" id="steps" placeholder="Daily Steps">

<button onclick="predict()">Predict</button>

</div>

<div id="slide3" class="slide">

<h2>Prediction Result</h2>

<div id="score" class="score"></div>

<h3 id="quality"></h3>

<p id="tip"></p>

<button onclick="showSlide(1)">Try Again</button>

</div>

</div>

<script>

function showSlide(num){

document.getElementById("slide1").style.display="none";
document.getElementById("slide2").style.display="none";
document.getElementById("slide3").style.display="none";

document.getElementById("slide"+num).style.display="block";

}

function predict(){

let sleep =
parseFloat(document.getElementById("sleep").value);

let stress =
parseInt(document.getElementById("stress").value);

let steps =
parseInt(document.getElementById("steps").value);

let score = 50;

if(sleep >= 7) score += 25;
if(stress <= 5) score += 15;
if(steps >= 8000) score += 10;

let quality="";
let tip="";

if(score >= 80){
quality="✅ Good Sleep";
tip="Maintain your healthy sleep routine.";
}
else if(score >= 60){
quality="😐 Average Sleep";
tip="Try reducing stress and staying active.";
}
else{
quality="⚠️ Poor Sleep";
tip="Increase sleep duration and manage stress.";
}

document.getElementById("score").innerHTML =
score + "/100";

document.getElementById("quality").innerHTML =
quality;

document.getElementById("tip").innerHTML =
tip;

showSlide(3);

}

</script>

</body>
</html>
